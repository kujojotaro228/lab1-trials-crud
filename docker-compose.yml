
name: trials

x-db-env: &db-env
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: ${POSTGRES_DB:-trials}
  DB_USER: ${POSTGRES_USER:-trials}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trials}
      POSTGRES_USER: ${POSTGRES_USER:-trials}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data      # том під дані; теки initdb.d немає
    healthcheck:
      # -h 127.0.0.1: перевірка по TCP. Під час initdb тимчасовий сервер
      # слухає лише unix-сокет, тому "healthy" настає тільки для справжнього сервера.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
      start_interval: 1s
    networks: [backend]
    restart: unless-stopped

  # Додаткова вимога варіанта 25: схема накочується окремим разовим контейнером.
  migrate:
    build: .
    command: ["python", "-m", "app.migrate"]
    environment: *db-env
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    restart: "no"

  web:
    build: .
    environment:
      <<: *db-env
      DB_POOL_MIN: "2"
      DB_POOL_SIZE: "10"                      # варіант 25: найбільша кількість зʼєднань екземпляра
      # POD_NAME не задано: з --scale у всіх реплік були б однакові значення,
      # тому імʼям екземпляра (заголовок X-Pod) стає hostname контейнера
      LIST_DEFAULT_LIMIT: "20"
      LIST_MAX_LIMIT: "100"
    expose:
      - "8000"                                # порт НЕ публікується на хост
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "-T", "2", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 1s
    # SIGTERM -> коректна зупинка (до 20 с, SHUTDOWN_TIMEOUT), SIGKILL лише після 30 с
    stop_signal: SIGTERM
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    ulimits:
      nofile: { soft: 65535, hard: 65535 }
    networks: [backend, frontend]
    restart: unless-stopped

  lb:
    image: nginx:1.28-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${LB_PORT:-8080}:80"                 # єдиний порт, опублікований на хост
    depends_on:
      web:
        condition: service_healthy
    ulimits:
      nofile: { soft: 65535, hard: 65535 }
    networks: [frontend]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus                  # іменований том під часові ряди
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"       # сторінка Targets: http://localhost:9090/targets
    networks: [frontend]                      # у тій самій мережі, що й web
    restart: unless-stopped

  loadgen:
    image: python:3.12-alpine
    profiles: ["tools"]
    working_dir: /work
    entrypoint: ["python", "-u"]
    volumes:
      - ./loadtest:/work/loadtest:ro
      - ./results:/work/results
    ulimits:
      nofile: { soft: 65535, hard: 65535 }
    networks: [frontend]

networks:
  frontend: {}
  backend: {}

volumes:
  pgdata: {}
  promdata: {}
