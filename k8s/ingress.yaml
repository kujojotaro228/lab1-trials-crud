# Вимога Д3: вбудований у k3s Ingress-контролер Traefik перед web (localhost:8081).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: trials
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: {number: 8000}
