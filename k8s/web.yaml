# web service. No replicas field: the count is set by kubectl scale or the HPA,
# and re-applying the manifest does not reset it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: trials
  labels: {app: web}
spec:
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: web
          image: trials-web:lab4
          imagePullPolicy: Never
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: web-config}
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: db-secret, key: POSTGRES_PASSWORD}
            - name: POD_NAME                       # Downward API -> X-Pod header
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
          resources:
            requests: {cpu: 250m, memory: 128Mi}   # variant 25: 250m / 500m
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6                    # 60 s: do not restart the pod while it is overloaded
          lifecycle:
            preStop:
              sleep: {seconds: 5}                  # time for kube-proxy to remove the pod from routing
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: trials
  labels: {app: web}
spec:
  type: NodePort
  selector: {app: web}
  ports:
    - {name: http, port: 8000, targetPort: http, nodePort: 30080}
